<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mistral-sticky-arch-title mistral-sticky-arch-desc">
      <title id="mistral-sticky-arch-title">One conversation, one Mistral key</title>
      <desc id="mistral-sticky-arch-desc">Clients and an optional relay send Chat Completions to mistral-sticky, which pins the session to one key from keys.txt and forwards the request to api.mistral.ai.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows -->
      <line x1="180" y1="240" x2="240" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="192" y="220" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHAT</text>

      <line x1="380" y1="240" x2="440" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="390" y="220" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="410" y="229" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOKEN</text>

      <line x1="620" y1="240" x2="700" y2="240" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="636" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="229" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEARER</text>

      <line x1="530" y1="288" x2="530" y2="360" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="540" y="312" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="321" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HASH</text>

      <!-- Client -->
      <rect x="40" y="200" width="140" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="140" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="206" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="215" fill="rgba(122,131,153,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="110" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="110" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Chat Completions</text>

      <!-- Relay (optional) -->
      <rect x="240" y="200" width="140" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="200" width="140" height="80" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="248" y="206" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="268" y="215" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RELAY</text>
      <text x="310" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Relay</text>
      <text x="310" y="260" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">optional</text>

      <!-- mistral-sticky (focal) -->
      <rect x="440" y="192" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="192" width="180" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="198" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="464" y="207" fill="rgba(235,108,54,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">POOL</text>
      <text x="530" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">mistral-sticky</text>
      <text x="530" y="256" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">:8080</text>

      <!-- api.mistral.ai -->
      <rect x="700" y="200" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="200" width="180" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="708" y="206" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
      <text x="722" y="215" fill="rgba(45,49,66,0.50)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="790" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">api.mistral.ai</text>
      <text x="790" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">prefix cache</text>

      <!-- keys.txt -->
      <rect x="450" y="360" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="450" y="360" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="458" y="366" width="32" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="474" y="375" fill="rgba(79,93,117,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
      <text x="530" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">keys.txt</text>
      <text x="530" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one key / line</text>

      <!-- Legend -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="552" width="16" height="16" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="164" y="564" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Client</text>

      <rect x="280" y="552" width="16" height="16" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="304" y="564" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Optional relay</text>

      <rect x="460" y="552" width="16" height="16" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="484" y="564" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Key pool</text>

      <rect x="600" y="552" width="16" height="16" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="624" y="564" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Key file</text>

      <rect x="740" y="552" width="16" height="16" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="764" y="564" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Mistral API</text>
    </svg>
